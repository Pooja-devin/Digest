name: Digest Auto Feed Sync

on:
  schedule:
    # Ovvoru 6 mani nerathukkum automatic-ah run aagum (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Ungalukku eppo venumo appo GitHub dashboard-la irundhu manual-ah trigger pannikalam

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper & AI Extractor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/cron_sync.py

      - name: Commit & Push Updated Database (if SQLite)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add digest.db chroma_db/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto-sync): update opportunities database [skip ci]" && git push)